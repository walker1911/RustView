name: Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Install the tested Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.1
          rustup target add x86_64-pc-windows-msvc
      - name: Prepare pinned official image engines
        run: .\tools\fetch-native.ps1
      - name: Unit tests
        run: cargo test --locked -- --test-threads=2
      - name: Build the public bootstrap package
        run: .\tools\package-public.ps1
      - name: Test a fully prepared local runtime
        run: |
          .\tools\build.ps1 -SkipBuild -Offline -OutputRoot .\test-output\ci-local
          $version = ([regex]::Match((Get-Content Cargo.toml -Raw),'(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          $exe = Join-Path (Get-Location) ('test-output\ci-local\RustView-' + $version + '\RustView.exe')
          python tools/smoke_test.py --exe $exe --output test-output/smoke-ci.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/animation_smoke.py --exe $exe --output test-output/animation-ci.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload only the bootstrap package
        uses: actions/upload-artifact@v4
        with:
          name: RustView-windows-x64-bootstrap
          path: |
            dist/*-win-x64-bootstrap.zip
            dist/*-win-x64-bootstrap.zip.sha256
          if-no-files-found: error
          retention-days: 14
