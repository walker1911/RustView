<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">RustView archive browsing pipeline</title><desc id="desc">Read selected entries from ZIP, RAR and 7z, decode them in a bounded worker, then deliver image pixels to the viewer. Architecture illustration.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="m0 0 5 3-5 3" fill="none" stroke="#497e6c" stroke-width="1.3"/></marker></defs><rect width="1200" height="460" rx="24" fill="#f4f6ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="64" fill="#173c36" font-size="35" font-weight="700" letter-spacing="-.8">Browse inside. Extract on demand.</text><text x="48" y="101" fill="#62766b" font-size="18">A selected entry moves through the pipeline; the whole archive stays packed.</text>
<rect x="48" y="151" width="275" height="216" rx="18" fill="#173f3c"/><g fill="none" stroke="#b5dfbd" stroke-width="2.5"><path d="M76 182h35l11 12v41H76Z"/><path d="M111 182v13h11M91 184v41M85 192h12m-12 8h12m-12 8h12m-12 8h12"/></g><text x="76" y="274" fill="#f0f5e6" font-size="25" font-weight="700">ZIP / RAR / 7z</text><text x="76" y="307" fill="#b5cdbd" font-size="16">Browse the image index</text><text x="76" y="334" fill="#b5cdbd" font-size="16">Ask for a password when needed</text>
<path d="M341 258h42" stroke="#497e6c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="404" y="151" width="342" height="216" rx="18" fill="#e2ecdd" stroke="#c6d9c7"/><g fill="none" stroke="#3f7861" stroke-width="2.5"><rect x="433" y="181" width="44" height="44" rx="9"/><path d="m443 203 8 8 16-19M445 174v7m13-7v7m-13 44v7m13-7v7m-32-39h7m-7 14h7m44-14h7m-7 14h7"/></g><text x="433" y="274" fill="#234c3e" font-size="25" font-weight="700">Decode in a worker</text><text x="433" y="307" fill="#536e5b" font-size="16">One image task at a time</text><text x="433" y="334" fill="#536e5b" font-size="16">2 GiB image-process-tree limit</text>
<path d="M765 258h42" stroke="#497e6c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="829" y="151" width="323" height="216" rx="18" fill="#ffffff" stroke="#d4dfcf"/><g fill="none" stroke="#3f7861" stroke-width="2.5"><rect x="858" y="181" width="53" height="40" rx="7"/><path d="m862 214 15-17 13 13 8-9 9 13"/><circle cx="899" cy="190" r="3"/></g><text x="858" y="274" fill="#234c3e" font-size="25" font-weight="700">Keep moving</text><text x="858" y="307" fill="#65766b" font-size="16">Smooth, pointer-anchored zoom</text><text x="858" y="334" fill="#65766b" font-size="16">On-demand image / frame delivery</text>
<text x="48" y="411" fill="#68796e" font-size="14">Passwords stay in the session. RAR is read-only. Split volumes are not supported. Architecture diagram, not a UI screenshot.</text></g></svg>