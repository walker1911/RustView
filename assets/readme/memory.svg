<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">RustView memory budgets</title><desc id="desc">Independent limits for image LRU, GPU detail tiles and the image worker tree. These limits are not the whole application's memory usage.</desc><rect width="1200" height="590" rx="24" fill="#10292c"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="67" fill="#eef3e6" font-size="35" font-weight="700" letter-spacing="-.8">Give every layer a limit.</text><text x="48" y="105" fill="#a7c2b4" font-size="18">Bounded caches and isolated decoding — with a route back to the original image.</text>
<g><rect x="48" y="152" width="350" height="191" rx="16" fill="#1b3b3d" stroke="#365759"/><text x="73" y="189" fill="#9eccb3" font-size="13" font-weight="700" letter-spacing="1.8">IMAGE LRU CACHE</text><text x="71" y="256" fill="#d7eed9" font-size="58" font-weight="700">768</text><text x="208" y="256" fill="#b7d8c3" font-size="24">MiB</text><text x="73" y="308" fill="#b2c8bb" font-size="16">Evict older images, keep navigation light.</text></g>
<g><rect x="425" y="152" width="350" height="191" rx="16" fill="#1b3b3d" stroke="#365759"/><text x="450" y="189" fill="#9eccb3" font-size="13" font-weight="700" letter-spacing="1.8">GPU DETAIL TILES</text><text x="448" y="256" fill="#d7eed9" font-size="58" font-weight="700">256</text><text x="585" y="256" fill="#b7d8c3" font-size="24">MiB</text><text x="450" y="308" fill="#b2c8bb" font-size="16">Upload visible detail in LOD tiles.</text></g>
<g><rect x="802" y="152" width="350" height="191" rx="16" fill="#24433d" stroke="#557563"/><text x="827" y="189" fill="#e5c98a" font-size="13" font-weight="700" letter-spacing="1.8">IMAGE WORKER TREE</text><text x="825" y="256" fill="#f2d492" font-size="58" font-weight="700">2</text><text x="875" y="256" fill="#d6c399" font-size="24">GiB</text><text x="827" y="308" fill="#c1d0bd" font-size="16">A Windows Job bounds child processes.</text></g>
<path d="M48 382h1104" stroke="#315354"/>
<text x="48" y="425" fill="#d2e4d6" font-size="24" font-weight="700">Animation: one current frame, one frame ahead.</text>
<g font-size="13" font-weight="700"><rect x="48" y="451" width="126" height="46" rx="8" fill="#9bd5af"/><text x="76" y="480" fill="#173e36">CURRENT</text><rect x="188" y="451" width="126" height="46" rx="8" fill="none" stroke="#8bb39b"/><text x="212" y="480" fill="#b5d7bf">PREFETCH</text><path d="M335 474h42" stroke="#789989" stroke-width="2"/><text x="397" y="480" fill="#9db8a9" font-size="15" font-weight="400">Pull the next frame; avoid collecting an entire animation in Rust.</text></g>
<text x="48" y="547" fill="#93aea2" font-size="14">Independent budgets, not total application RAM. Current pixels, overviews, fonts and GPU drivers add overhead.</text></g></svg>